name: Oração Automática
version: "1.0.0"
slug: oracao_automatica
description: Baixa a oração do Telegram e envia no WhatsApp todos os dias
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:hands-pray
panel_title: Oração
homeassistant_api: true
map:
  - type: media
    read_only: false
options:
  api_id: 0
  api_hash: ""
  horario_inicio: "04:00"
  horario_fim: "12:00"
  apenas_um_por_dia: true
  intervalo_min_segundos: 20
  intervalo_max_segundos: 60
schema:
  api_id: int
  api_hash: password
  horario_inicio: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  horario_fim: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  apenas_um_por_dia: bool
  intervalo_min_segundos: int(5,600)
  intervalo_max_segundos: int(5,1200)
  legenda: str?
  servico_notificacao: str?
