name: Oração Automática
version: "1.1.0"
slug: oracao_automatica
description: Baixa a oração do Telegram e envia no WhatsApp todos os dias
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:hands-pray
panel_title: Oração
homeassistant_api: true
map:
  - type: media
    read_only: false
options:
  api_id: 0
  api_hash: ""
  horario_inicio: "04:00"
  horario_fim: "12:00"
  apenas_um_por_dia: true
  intervalo_min_segundos: 20
  intervalo_max_segundos: 60
  mensagem_segunda: "Bom dia, uma segunda-feira e uma semana abençoada para todos nós! 🙏"
  mensagem_terca: "Bom dia, uma terça-feira abençoada para todos nós! 🙏"
  mensagem_quarta: "Bom dia, uma quarta-feira abençoada para todos nós! 🙏"
  mensagem_quinta: "Bom dia, uma quinta-feira abençoada para todos nós! 🙏"
  mensagem_sexta: "Bom dia, uma sexta-feira abençoada e um ótimo fim de semana para todos nós! 🙏"
  mensagem_sabado: "Bom dia, um sábado abençoado para todos nós! 🙏"
  mensagem_domingo: "Bom dia, um domingo abençoado para todos nós! 🙏"
schema:
  api_id: int
  api_hash: password
  horario_inicio: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  horario_fim: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  apenas_um_por_dia: bool
  intervalo_min_segundos: int(5,600)
  intervalo_max_segundos: int(5,1200)
  legenda: str?
  mensagem_segunda: str?
  mensagem_terca: str?
  mensagem_quarta: str?
  mensagem_quinta: str?
  mensagem_sexta: str?
  mensagem_sabado: str?
  mensagem_domingo: str?
  servico_notificacao: str?
