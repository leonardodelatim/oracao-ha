configuration:
  api_id:
    name: Telegram api_id
    description: Número obtido em my.telegram.org > API development tools.
  api_hash:
    name: Telegram api_hash
    description: Texto obtido no mesmo lugar do api_id.
  horario_envio:
    name: Horário do envio
    description: Formato HH:MM. Todo dia, neste horário, a oração do dia é enviada para os destinos.
  horario_alerta:
    name: Horário do aviso
    description: Se até este horário o áudio do dia não chegou no Telegram, você recebe um aviso no seu WhatsApp.
  horario_limite:
    name: Horário limite
    description: Depois do aviso, continua conferindo até este horário e envia se o áudio chegar. Passou disso, o dia é encerrado sem envio.
  audio_vespera_a_partir_de:
    name: Áudio da véspera a partir de
    description: Áudios postados a partir deste horário contam como a oração do dia seguinte (a emissora costuma postar por volta das 21h).
  intervalo_min_segundos:
    name: Pausa mínima entre envios (segundos)
    description: Quanto maior, menor o risco de bloqueio no WhatsApp.
  intervalo_max_segundos:
    name: Pausa máxima entre envios (segundos)
    description: A pausa real é sorteada entre o mínimo e o máximo.
  legenda:
    name: Mensagem depois do áudio
    description: Texto opcional enviado logo após o áudio, por exemplo "Bom dia! 🙏".
  mensagem_segunda:
    name: Mensagem de segunda-feira
    description: Texto enviado ANTES do áudio na segunda-feira. Deixe em branco para enviar só o áudio.
  mensagem_terca:
    name: Mensagem de terça-feira
    description: Texto enviado ANTES do áudio na terça-feira. Deixe em branco para enviar só o áudio.
  mensagem_quarta:
    name: Mensagem de quarta-feira
    description: Texto enviado ANTES do áudio na quarta-feira. Deixe em branco para enviar só o áudio.
  mensagem_quinta:
    name: Mensagem de quinta-feira
    description: Texto enviado ANTES do áudio na quinta-feira. Deixe em branco para enviar só o áudio.
  mensagem_sexta:
    name: Mensagem de sexta-feira
    description: Texto enviado ANTES do áudio na sexta-feira. Deixe em branco para enviar só o áudio.
  mensagem_sabado:
    name: Mensagem de sábado
    description: Texto enviado ANTES do áudio no sábado. Deixe em branco para enviar só o áudio.
  mensagem_domingo:
    name: Mensagem de domingo
    description: Texto enviado ANTES do áudio no domingo. Deixe em branco para enviar só o áudio.
  servico_notificacao:
    name: Serviço de notificação
    description: Opcional. Ex. notify.mobile_app_meu_celular — avisa quando enviar ou se der problema.
